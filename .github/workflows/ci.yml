name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://research:research@localhost:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests scripts ../evaluation --select F,E9,B --ignore B008 --line-length 120
      - name: Migrations apply to an empty database and match the models
        run: DATABASE_URL=$TEST_DATABASE_URL python -m alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL python -m alembic check
      - name: Unit, orchestration and API tests (SQLite, scripted model, offline web)
        run: python -m pytest
      - name: Full suite on PostgreSQL
        run: USE_TEST_POSTGRES=1 python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
